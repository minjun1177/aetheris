name: CI

on:
  # Every branch, not just main: a push is the first moment the suite can run
  # somewhere that is not the author's own machine, which is the whole point.
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suite needs no Ollama daemon and no network: every provider is faked.
    # `test_platform.py` is the exception in spirit - it checks this machine's
    # waiting-for-input detection - which is why Windows and macOS are here too.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.10 is the floor README.md claims. It is tested so the claim cannot
        # quietly stop being true.
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import every module
        # 5.2 in ARCHITECTURE.md: `config.py` builds the system prompt at import
        # time, so a module-level `import config` anywhere below it stops the
        # whole program from importing. That failure has to be caught here.
        run: |
          python -c "from aetheris import app, llm_client, tools, toolspec, providers, context, session, permissions, skills, websearch, mcp_client, renderer, tui, deepthink, git_ops, subagent, channel, atomic, sse, shell_session, connect, systemprompt, config, paths, terms, vault, vm"
          python -c "import aetheris.__main__"

      - name: Tests
        shell: bash
        env:
          # The tests are scripts, not the harness, and they print the same box
          # characters it does. `app.cli()` reconfigures the real program's
          # output; nothing reconfigures theirs, and a pipe on Windows defaults
          # to the locale code page.
          PYTHONIOENCODING: utf-8
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          failed=0
          for t in tests/*.py; do
            echo "::group::$t"
            python "$t" || { echo "FAILED: $t"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8
      - name: A tag must be the version in the code
        # A tag push runs this workflow, which is the last point where the
        # number is still free: the tag can be moved, a PyPI upload cannot be
        # taken back. Skipped on a branch, where there is no tag to disagree.
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/check_version.py

      - name: Lint
        # Errors only: undefined names, syntax errors, broken f-strings. Style
        # is deliberately not enforced.
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,build,dist,node_modules,'*venv*'
