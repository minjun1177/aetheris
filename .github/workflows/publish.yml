name: Publish

# Publishing is deliberately not automatic on a tag. A version can never be
# re-uploaded to PyPI - not corrected, not replaced, only yanked - so the thing
# that starts a release is a person, either by publishing a GitHub Release or by
# running this workflow by hand and saying which index to send it to.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to send it (dry-run uploads nothing)"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the metadata PyPI will reject
        run: python -m twine check --strict dist/*

      - name: The tag must be the version being published
        # An upload cannot be taken back, so a tag that disagrees with
        # `aetheris.__version__` stops the release here rather than
        # putting the wrong number on PyPI for good.
        env:
          # Empty on a branch, so a dry run from main still builds. A hand-run
          # dispatch from a tag is now checked too - that is how a 0.3.1 wheel
          # got built out of a v0.4.0 checkout.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python .github/check_version.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: What a dry run proves
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'dry-run'
        run: |
          echo "Built and checked. Nothing was uploaded."
          echo "The files are on this run as the 'dist' artifact."
          ls -la dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # Trusted Publishing: no token is stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A version that is already on the index is not an error here. The
          # normal path is a hand-run dispatch to testpypi, then one to pypi,
          # and only then a GitHub Release for the humans - and `published`
          # fires this workflow again over files that have already gone up.
          # PyPI never lets an upload be replaced, so this can only skip a
          # no-op; it cannot quietly ship something different.
          skip-existing: true

  pypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true       # see the note on the testpypi job
