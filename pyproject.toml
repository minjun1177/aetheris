[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aetheris"
# One source of truth: `aetheris.__version__`. Two copies of a version
# drift, and the one that ends up wrong is always the one users are told.
dynamic = ["version"]
description = "A terminal AI assistant that works with small local models - two tool protocols, one tool table, and an undo for everything it writes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "minjun1177" }]
keywords = ["llm", "ollama", "cli", "agent", "mcp", "local-llm", "tool-calling"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

# The floors are the versions the suite is actually run against and the
# ceilings stop the next breaking release arriving unannounced; the reasoning
# is in requirements.txt, which stays the single place they are written down.
dependencies = [
    "ollama>=0.6.2,<1.0",
    "prompt_toolkit>=3.0.53,<4.0",
    "ddgs>=9.0,<10.0",
    "requests>=2.34.2,<3.0",
    "beautifulsoup4>=4.15.0,<5.0",
    "psutil>=7.2.2,<8.0",
]

[project.optional-dependencies]
# Tree-sitter powers `get_code_skeleton` and `query_ast_node` only. Ten grammars
# is a lot of wheels to pull for two tools, and `config.py` already runs without
# them, so they are opt-in: pip install "aetheris[ast]"
ast = [
    "tree-sitter>=0.26.0,<0.27",
    "tree-sitter-python>=0.25.0,<0.26",
    "tree-sitter-javascript>=0.25.0,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "tree-sitter-java>=0.23.5,<0.24",
    "tree-sitter-c>=0.24.2,<0.25",
    "tree-sitter-cpp>=0.23.4,<0.24",
    "tree-sitter-go>=0.25.0,<0.26",
    "tree-sitter-rust>=0.24.2,<0.25",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
]

[project.urls]
Homepage = "https://github.com/minjun1177/aetheris"
Repository = "https://github.com/minjun1177/aetheris"
Issues = "https://github.com/minjun1177/aetheris/issues"

[project.scripts]
aetheris = "aetheris.app:cli"

[tool.setuptools]
packages = ["aetheris"]

[tool.setuptools.dynamic]
version = { attr = "aetheris.__version__" }
